<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="style/sleep_outside.css">
</head>
<body>
  <header class="divider">
    <div class="logo">
      <img src="images/icon10.webp" alt="Sleep Outside Logo">
      <a href="index.html">Sleep<span class="highlight">Outside</span></a>
    </div>
  </header>

  <main class="divider">
    <section class="hero">
      <h2>Welcome to Sleep Outside</h2>
      <p>Your destination for top-quality camping gear.</p>
    </section>

    <!--Newsletter Subscription form -->
    <section class="newsletter">
      <h3>Subscribe to our Newsletter</h3>
      <p>Get exclusive deals and outdoor tips delivered straight to your inbox.</p>
      <form id="newsletter-form" action="#" method="post">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <button type="submit" id="subscribe-btn">Subscribe</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; Sleep Outside. All rights reserved by Jeimi.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
