<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtGallery - Digital Art Collection</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <h1>ArtGallery</h1>
    </div>
    <div class="nav-search">
      <input type="text" id="search-input" placeholder="Search artworks, artists, eras...">
      <button id="search-btn">Search</button>
    </div>
    <div class="nav-actions">
      <button id="theme-toggle">Dark Mode</button>
      <div id="favorites-btn">My Collections (<span id="fav-count">0</span>)</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <span class="badge">MASTERPIECE OF THE DAY</span>
        <h2 id="hero-title">Loading Masterpiece...</h2>
        <p id="hero-artist">Please wait while we connect to the museum.</p>
      </div>
      <div class="hero-image-container">
        <img id="hero-img" src="" alt="Masterpiece of the Day">
      </div>
    </section>

    <section class="filter-section">
      <div class="tags">
        <button class="tag-btn" data-query="Monet">Monet</button>
        <button class="tag-btn" data-query="Van Gogh">Van Gogh</button>
        <button class="tag-btn" data-query="Impressionism">Impressionism</button>
        <button class="tag-btn" data-query="Japanese Prints">Japanese Prints</button>
      </div>
    </section>

    <section class="gallery-section">
      <h2>Explore Museum Collection</h2>
      <div id="gallery-grid" class="gallery-grid">
        <p>Loading gallery artworks...</p>
      </div>
    </section>
  </main>

  <div id="art-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="close-modal">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Digital Art Gallery. Powered by Art Institute of Chicago API.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
